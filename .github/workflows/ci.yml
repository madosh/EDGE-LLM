name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Go Control Plane ──────────────────────────────────────────────────────
  go:
    name: Go (control-plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cami
          POSTGRES_PASSWORD: cami
          POSTGRES_DB: cami
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cami" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: control-plane/go.sum

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Go proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.4.0

      - name: Generate proto
        run: |
          mkdir -p gen
          protoc \
            --go_out=. \
            --go_opt=module=github.com/cami-fleet/control-plane \
            --go-grpc_out=. \
            --go-grpc_opt=module=github.com/cami-fleet/control-plane \
            -I proto \
            proto/device.proto

      - name: Tidy
        run: GOFLAGS=-mod=mod go mod tidy

      - name: Vet
        run: GOFLAGS=-mod=mod go vet ./...

      - name: Test
        run: GOFLAGS=-mod=mod go test -short -race -timeout 120s ./...

      # Without -short: the store queries run against a real, throwaway Postgres.
      - name: Postgres store integration tests
        env:
          POSTGRES_DSN: postgres://cami:cami@localhost:5432/cami?sslmode=disable
        run: GOFLAGS=-mod=mod go test -race -timeout 120s ./internal/store/postgres/

  # ── ESP32 display firmware ────────────────────────────────────────────────
  firmware:
    name: Firmware (ESP32 display)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-display
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/esp32-display/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # secrets.h is git-ignored (Wi-Fi password, device key). The template
      # compiles; the image just cannot join a network, which CI never needs.
      - name: Placeholder secrets
        run: cp include/secrets.example.h include/secrets.h

      - name: Build
        run: pio run

  # ── Rust Agent ────────────────────────────────────────────────────────────
  rust:
    name: Rust (agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target

      - name: Format check
        working-directory: agent
        run: cargo fmt --check

      - name: Clippy
        working-directory: agent
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: agent
        run: cargo test

  # ── SvelteKit Web UI ──────────────────────────────────────────────────────
  web:
    name: Web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

  # ── Docker Build Verification ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control-plane
        run: docker build -f control-plane/Dockerfile -t cami-fleet/control-plane:ci .

      - name: Build agent
        run: docker build -f agent/Dockerfile -t cami-fleet/agent:ci .

      - name: Build web
        run: docker build -f web/Dockerfile -t cami-fleet/web:ci ./web

  # ── End-to-end: the whole stack, as a user runs it ────────────────────────
  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Run the end-to-end scenario
        run: scripts/e2e.sh

      - name: Failure paths (tampered artifact, rollback, offline, revocation)
        run: scripts/demo-failures.sh

      - name: Container state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
