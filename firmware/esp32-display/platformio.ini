; Cami Fleet status display: ESP32-S3 2.8" ILI9341 touch board
; (LCDWIKI ES3C28P, sold by diymore as a Xiaozhi display). See docs/esp32-display.md.

[env:esp32-display]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17, ESP-IDF 4.4
board = esp32-s3-devkitc-1
framework = arduino
; 3 MB app, no OTA slot: fits the 4 MB, 8 MB and 16 MB flash variants of the module.
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ; Serial goes over the native USB port (the board's only USB-C).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.2.1
