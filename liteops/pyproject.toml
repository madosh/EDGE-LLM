[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "liteops"
version         = "0.1.0"
description     = "Production operations framework for LiteRT edge AI deployments"
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "MIT" }
keywords        = ["litert", "edge-ai", "llm", "observability", "fleet-management"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
    "prometheus-client>=0.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
routing     = ["langchain>=0.2", "langgraph>=0.1", "langchain-openai>=0.1"]
servicenow  = ["requests>=2.31"]
langfuse    = ["langfuse>=2.0"]
dev         = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.9",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["tests"]
addopts        = "-v --tb=short"

[tool.black]
line-length    = 100
target-version = ["py311"]

[tool.isort]
profile        = "black"
line_length    = 100

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict         = true
ignore_missing_imports = true
