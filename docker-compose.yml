name: cami-fleet

volumes:
  pg-data:
  ch-data:
  certs:          # per-service certificate directories (see scripts/gen-certs.sh)
  ca-private:     # CA private key — mounted only into cert-gen
  model-cache:    # verified model artifacts, named by SHA-256
  ollama-data:

networks:
  fleet:
    driver: bridge

services:

  # ── One-shot init: generate mTLS certs ──────────────────────────────────────
  cert-gen:
    image: alpine:3.19
    command: >
      sh -c "apk add --no-cache openssl && sh /scripts/gen-certs.sh"
    environment:
      CERT_DIR: /certs
      CA_DIR: /ca
      # One certificate per device; its common name is the device name.
      DEVICE_NAMES: "device-barcelona-1 device-barcelona-2 device-edge-litert device-edge-ollama ${EXTRA_DEVICE_NAMES:-}"
      # Names physical devices use to reach this host, e.g. "IP:192.168.1.20".
      SERVER_SANS: "${SERVER_SANS:-}"
    volumes:
      - certs:/certs
      - ca-private:/ca
      - ./scripts/gen-certs.sh:/scripts/gen-certs.sh:ro
    networks:
      - fleet

  # ── One-shot init: create stub artifact + sha256 sidecar ────────────────────
  artifact-init:
    image: alpine:3.19
    command:
      - sh
      - -c
      - |
        if [ ! -f /artifacts/sample-gemma-4-e2b.tar.gz ]; then
          echo "FAKE MODEL ARTIFACT — sample-gemma-4-e2b v0.1 (testing stub)" > /tmp/model-info.txt
          tar -czf /artifacts/sample-gemma-4-e2b.tar.gz -C /tmp model-info.txt
          sha256sum /artifacts/sample-gemma-4-e2b.tar.gz | cut -d' ' -f1 \
            > /artifacts/sample-gemma-4-e2b.tar.gz.sha256
          echo "Artifact SHA-256: $(cat /artifacts/sample-gemma-4-e2b.tar.gz.sha256)"
        else
          echo "Artifact already exists — skipping"
        fi
    volumes:
      - ./artifacts:/artifacts
    networks:
      - fleet

  # ── Postgres 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       cami
      POSTGRES_USER:     cami
      POSTGRES_PASSWORD: cami
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cami -d cami"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - fleet

  # ── ClickHouse 23.8 LTS ──────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    environment:
      CLICKHOUSE_DB:                     cami
      CLICKHOUSE_USER:                   cami
      CLICKHOUSE_PASSWORD:               cami
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=cami --password=cami --query='SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - fleet

  # ── NATS 2.10 with JetStream ─────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleet

  # ── LiteRT-LM (real on-device inference) — profile "litert" ────────────────
  # Google's LiteRT-LM CLI ships `litert-lm serve`, an OpenAI-compatible server
  # (https://github.com/google-ai-edge/LiteRT-LM). The agent passes it the
  # absolute path of the artifact it has just verified, so the .litertlm file
  # that runs is byte-for-byte the one whose SHA-256 was checked. Both
  # containers mount model-cache at the same path for that reason.
  # On a real device (e.g. Raspberry Pi 5) run `litert-lm serve` next to the
  # agent instead; it listens on 127.0.0.1:9379 by default.
  litert:
    profiles: ["litert"]
    build:
      context: runtimes/litert-lm
    volumes:
      - model-cache:/var/lib/cami/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9379/v1/models')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - fleet
    restart: unless-stopped

  # ── Ollama (real LLM inference) ──────────────────────────────────────────────
  # For GPU support, add: deploy: { resources: { reservations: { devices: [{capabilities: [gpu]}] }}}
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fleet
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - fleet
    restart: unless-stopped

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - fleet
    restart: unless-stopped

  # ── Control Plane ─────────────────────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      POSTGRES_DSN:        "postgres://cami:cami@postgres:5432/cami?sslmode=disable"
      CLICKHOUSE_DSN:      "clickhouse://cami:cami@clickhouse:9000/cami"
      NATS_URL:            "nats://nats:4222"
      GRPC_PORT:           "9090"
      REST_PORT:           "8080"
      API_KEY:             "${CAMI_API_KEY:-changeme}"
      CERT_DIR:            /certs
      ARTIFACTS_DIR:       /artifacts
      ARTIFACTS_BASE_URL:  "http://control-plane:8080"
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: server
      - ./artifacts:/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    networks:
      - fleet
    restart: unless-stopped

  # ── Simulated device 1 (Jetson Orin, location=barcelona) — stub inference ──
  device-barcelona-1:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DEVICE_NAME:         device-barcelona-1
      DEVICE_LABELS:       "location=barcelona,type=jetson-orin"
      CONTROL_PLANE_URL:   "https://control-plane:9090"
      CERT_DIR:            /certs
      MODEL_CACHE_DIR:     /var/lib/cami/models
      RUST_LOG:            "cami_agent=info,warn"
      RUNTIME_BACKEND:     "stub"
    volumes:
      # Only this device's own key and certificate.
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: devices/device-barcelona-1
      - model-cache:/var/lib/cami/models
    depends_on:
      control-plane:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
    networks:
      - fleet
    restart: unless-stopped

  # ── Simulated device 2 (Raspberry Pi 5, location=barcelona) — stub inference
  device-barcelona-2:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DEVICE_NAME:         device-barcelona-2
      DEVICE_LABELS:       "location=barcelona,type=rpi5"
      CONTROL_PLANE_URL:   "https://control-plane:9090"
      CERT_DIR:            /certs
      MODEL_CACHE_DIR:     /var/lib/cami/models
      RUST_LOG:            "cami_agent=info,warn"
      RUNTIME_BACKEND:     "stub"
    volumes:
      # Only this device's own key and certificate.
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: devices/device-barcelona-2
      - model-cache:/var/lib/cami/models
    depends_on:
      control-plane:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
    networks:
      - fleet
    restart: unless-stopped

  # ── Real LiteRT-LM device — `docker compose --profile litert up` ───────────
  device-edge-litert:
    profiles: ["litert"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DEVICE_NAME:         device-edge-litert
      DEVICE_LABELS:       "location=lab,runtime=litert"
      CONTROL_PLANE_URL:   "https://control-plane:9090"
      CERT_DIR:            /certs
      MODEL_CACHE_DIR:     /var/lib/cami/models
      RUST_LOG:            "cami_agent=info,warn"
      RUNTIME_BACKEND:     "litert"
      LITERT_URL:          "http://litert:9379"
      LITERT_ACCELERATOR:  "cpu"
    volumes:
      # Only this device's own key and certificate.
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: devices/device-edge-litert
      - model-cache:/var/lib/cami/models
    depends_on:
      control-plane:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
      litert:
        condition: service_healthy
    networks:
      - fleet
    restart: unless-stopped

  # ── Real Ollama device — `docker compose --profile ollama up` ──────────────
  device-edge-ollama:
    profiles: ["ollama"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DEVICE_NAME:         device-edge-ollama
      DEVICE_LABELS:       "location=lab,runtime=ollama"
      CONTROL_PLANE_URL:   "https://control-plane:9090"
      CERT_DIR:            /certs
      MODEL_CACHE_DIR:     /var/lib/cami/models
      RUST_LOG:            "cami_agent=info,warn"
      RUNTIME_BACKEND:     "ollama"
      OLLAMA_URL:          "http://ollama:11434"
    volumes:
      # Only this device's own key and certificate.
      - type: volume
        source: certs
        target: /certs
        read_only: true
        volume:
          subpath: devices/device-edge-ollama
      - model-cache:/var/lib/cami/models
    depends_on:
      control-plane:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    networks:
      - fleet
    restart: unless-stopped

  # ── Web UI (SvelteKit) ──────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      API_KEY:              "${CAMI_API_KEY:-changeme}"
      CONTROL_PLANE_URL:    "http://control-plane:8080"
    ports:
      - "5173:3000"   # host 5173 (as documented) → adapter-node on 3000
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - fleet
    restart: unless-stopped
