name: cami-fleet

volumes:
  pg-data:
  ch-data:
  certs:
  ollama-data:
  litert-cache:

networks:
  fleet:
    driver: bridge

services:

  # ── One-shot init: generate mTLS certs ──────────────────────────────────────
  cert-gen:
    image: alpine:3.19
    command: >
      sh -c "apk add --no-cache openssl && sh /scripts/gen-certs.sh"
    environment:
      CERT_DIR: /certs
    volumes:
      - certs:/certs
      - ./scripts/gen-certs.sh:/scripts/gen-certs.sh:ro
    networks:
      - fleet

  # ── One-shot init: create stub artifact + sha256 sidecar ────────────────────
  artifact-init:
    image: alpine:3.19
    command:
      - sh
      - -c
      - |
        if [ ! -f /artifacts/sample-gemma-4-e2b.tar.gz ]; then
          echo "FAKE MODEL ARTIFACT — sample-gemma-4-e2b v0.1 (testing stub)" > /tmp/model-info.txt
          tar -czf /artifacts/sample-gemma-4-e2b.tar.gz -C /tmp model-info.txt
          sha256sum /artifacts/sample-gemma-4-e2b.tar.gz | cut -d' ' -f1 \
            > /artifacts/sample-gemma-4-e2b.tar.gz.sha256
          echo "Artifact SHA-256: $(cat /artifacts/sample-gemma-4-e2b.tar.gz.sha256)"
        else
          echo "Artifact already exists — skipping"
        fi
    volumes:
      - ./artifacts:/artifacts
    networks:
      - fleet

  # ── Postgres 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       cami
      POSTGRES_USER:     cami
      POSTGRES_PASSWORD: cami
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cami -d cami"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - fleet

  # ── ClickHouse 23.8 LTS ──────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    environment:
      CLICKHOUSE_DB:                     cami
      CLICKHOUSE_USER:                   cami
      CLICKHOUSE_PASSWORD:               cami
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=cami --password=cami --query='SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - fleet

  # ── NATS 2.10 with JetStream ─────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleet

  # ── "LiteRT" REST backend (optional — Gemini-compatible inference server) ────
  # IMPORTANT: Google LiteRT itself is an *on-device* runtime (Android/embedded),
  # not a server — see examples/litert-android for the real thing. The agent's
  # `litert` backend (agent/src/model_runtime.rs) is just an HTTP client that
  # speaks the Gemini `generateContent` REST API, so it can point at ANY
  # Gemini-compatible endpoint you front yourself (e.g. a wrapper around
  # LiteRT-LM, or a hosted Gemini-compatible gateway).
  #
  # There is no official `lit serve` command in Google LiteRT — to use this
  # backend, run your own server that exposes:
  #   POST /v1beta/models/{model}:generateContent
  # on port 8000, then set LITERT_URL on a device-agent below.
  # Docs: https://ai.google.dev/edge/litert
  #
  # litert:
  #   image: your-gemini-compatible-server:latest
  #   ports: ["8000:8000"]
  #   volumes:
  #     - litert-cache:/root/.cache
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 30
  #   networks:
  #     - fleet
  #   restart: unless-stopped

  # ── Ollama (real LLM inference) ──────────────────────────────────────────────
  # For GPU support, add: deploy: { resources: { reservations: { devices: [{capabilities: [gpu]}] }}}
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fleet
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - fleet
    restart: unless-stopped

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - fleet
    restart: unless-stopped

  # ── Control Plane ─────────────────────────────────────────────────────────────
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      POSTGRES_DSN:        "postgres://cami:cami@postgres:5432/cami?sslmode=disable"
      CLICKHOUSE_DSN:      "clickhouse://cami:cami@clickhouse:9000/cami"
      NATS_URL:            "nats://nats:4222"
      GRPC_PORT:           "9090"
      REST_PORT:           "8080"
      API_KEY:             "${CAMI_API_KEY:-changeme}"
      CERT_DIR:            /certs
      ARTIFACTS_DIR:       /artifacts
      ARTIFACTS_BASE_URL:  "http://control-plane:8080"
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - certs:/certs:ro
      - ./artifacts:/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    networks:
      - fleet
    restart: unless-stopped

  # ── Simulated device 1 (Jetson Orin, location=barcelona) — real Ollama inference
  device-1:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DEVICE_NAME:         device-barcelona-1
      DEVICE_LABELS:       "location=barcelona,type=jetson-orin"
      CONTROL_PLANE_URL:   "https://control-plane:9090"
      CERT_DIR:            /certs
      RUST_LOG:            "cami_agent=info,warn"
      RUNTIME_BACKEND:     "ollama"
      OLLAMA_URL:          "http://ollama:11434"
      # LITERT_URL:        "http://litert:8000"      # uncomment with litert service
      # LITERT_MODEL:      "gemma3-1b"               # model name served by lit serve
    volumes:
      - certs:/certs:ro
    depends_on:
      control-plane:
        condition: service_healthy
      ollama:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
    networks:
      - fleet
    restart: unless-stopped

  # ── Simulated device 2 (Raspberry Pi 5, location=barcelona) — stub inference
  device-2:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DEVICE_NAME:         device-barcelona-2
      DEVICE_LABELS:       "location=barcelona,type=rpi5"
      CONTROL_PLANE_URL:   "https://control-plane:9090"
      CERT_DIR:            /certs
      RUST_LOG:            "cami_agent=info,warn"
      RUNTIME_BACKEND:     "stub"
      # OLLAMA_URL:        "http://ollama:11434"      # uncomment to use ollama
      # LITERT_URL:        "http://litert:8000"       # uncomment with litert service
    volumes:
      - certs:/certs:ro
    depends_on:
      control-plane:
        condition: service_healthy
      cert-gen:
        condition: service_completed_successfully
    networks:
      - fleet
    restart: unless-stopped

  # ── Web UI (SvelteKit) ──────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      API_KEY:              "${CAMI_API_KEY:-changeme}"
      CONTROL_PLANE_URL:    "http://control-plane:8080"
    ports:
      - "5173:5173"
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - fleet
    restart: unless-stopped
