[package]
name    = "cami-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "cami_agent"
path = "src/lib.rs"

[[bin]]
name = "cami-agent"
path = "src/main.rs"

[dependencies]
tokio          = { version = "1",    features = ["full"] }
tonic          = { version = "0.12", features = ["tls"] }
prost          = "0.13"
sha2           = "0.10"
hex            = "0.4"
reqwest        = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes          = "1"
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream   = "0.1"
futures        = "0.3"
rand           = "0.8"
clap           = { version = "4",    features = ["derive", "env"] }
anyhow         = "1"

[build-dependencies]
tonic-build = "0.12"
